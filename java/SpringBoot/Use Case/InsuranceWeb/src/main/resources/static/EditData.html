<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Data</title>
</head>
<body>
    <h1>Edit Data</h1>
    <form action="/update" method="post">
        <input type="hidden" name="id" th:value="${fieldId}">

        <!-- Menampilkan field yang ingin diedit -->
        <label th:text="'Edit ' + ${fieldName}"></label>
        <input type="text" name="value" th:value="${currentValue}" required>

        <br><br>
        <button type="submit">Save</button>
    </form>
</body>
</html>
