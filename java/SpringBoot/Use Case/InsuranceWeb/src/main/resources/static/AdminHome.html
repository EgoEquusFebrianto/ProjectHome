<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Home - LHVIC</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f6fa;
            margin: 0;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            color: #2c3e50;
        }

        button {
            padding: 8px 14px;
            background-color: #2980b9;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1f6391;
        }

        .admin-card {
            display: flex;
            align-items: center;
            background-color: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0px 2px 6px rgba(0,0,0,0.15);
            max-width: 500px;
            margin-top: 20px;
        }

        .admin-card img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin-right: 20px;
        }

        .admin-info p {
            margin: 5px 0;
        }
    </style>    
</head>
<body>

    <header>
        <h1>Welcome, Admin</h1>
        <button onclick="alert('Menampilkan data user')">Tampilkan User</button>
    </header>

    <section class="admin-card">
        <img src="photo/anthony.jpg" alt="Admin Photo">
        <div class="admin-info">
            <p><strong>Name:</strong> Anthony Ferguson</p>
            <p><strong>Email:</strong> anthony@LHVIC.ac.id</p>
            <p><strong>Status:</strong> Admin Building B</p>
            <p><strong>Last Login:</strong> 2025-08-13 14:25</p>
        </div>
    </section>

</body>
</html>
