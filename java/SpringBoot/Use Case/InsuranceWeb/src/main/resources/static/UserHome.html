<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Home - LHVIC</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f6fa;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #2c3e50;
        }

        .user-card {
            display: flex;
            align-items: center;
            background-color: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0px 2px 6px rgba(0,0,0,0.15);
            max-width: 600px;
            margin-top: 20px;
        }

        .user-card img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin-right: 20px;
        }

        .user-info p {
            margin: 5px 0;
        }

        table {
            width: 47.6%;
            border-collapse: collapse;
            margin-top: 30px;
            background-color: white;
            box-shadow: 0px 2px 6px rgba(0,0,0,0.15);
        }

        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #2980b9;
            color: white;
        }

        button {
            padding: 6px 12px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1e8449;
        }
    </style>
</head>
<body>

    <h1>Welcome, User</h1>

    <section class="user-card">
        <img src="photo/peter.jpg" alt="User Photo">
        <div class="user-info">
            <p><strong>Name:</strong> Peter Griffin</p>
            <p><strong>Email:</strong> peter@gmail.com</p>
            <p><strong>Age:</strong> 43</p>
            <p><strong>Phone:</strong> 081234567890</p>
            <p><strong>Insurance:</strong> Health</p>
        </div>
    </section>

    <table>
        <thead>
            <tr>
                <th>Column</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Name</td>
                <td><a href="/edit?id=0"><button>Edit</button></a></td>
            </tr>
            <tr>
                <td>Email</td>
                <td><a href="/edit?id=1"><button>Edit</button></a></td>
            </tr>
            <tr>
                <td>Birth Day</td>
                <td><a href="/edit?id=2"><button>Edit</button></a></td>
            </tr>
            <tr>
                <td>Phone Number</td>
                <td><a href="/edit?id=3"><button>Edit</button></a></td>
            </tr>
        </tbody>
    </table>

</body>
</html>
